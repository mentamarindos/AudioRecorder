name: Build APK (ARMv8)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already contains the Android SDK, but it exports neither
      # ANDROID_HOME nor cmdline-tools on PATH until something sets them up.
      # android-actions/setup-android is deliberately not used: it runs `sdkmanager tools`, and
      # that legacy package no longer exists in the current SDK repository, which makes the action
      # fail on today's runner images.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type d -name bin | head -n 1)"
          if [ -z "$CMDLINE_BIN" ]; then
            echo "::error::cmdline-tools not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "SDK root: $SDK_ROOT"
          echo "cmdline-tools: $CMDLINE_BIN"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # The build uses compileSdk 37. Install it explicitly so the build does not depend on the
      # platform happening to be preinstalled on the runner image. API 37 is published under the
      # minor-versioned package name android-37.0 - there is no plain `platforms;android-37`.
      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The app contains no native libraries (no .so, no jniLibs), so there is nothing to split
      # per ABI: the produced APK runs on arm64-v8a (ARMv8) and every other supported ABI alike.
      # The artifact is named for ARMv8 to match the requested target.
      - name: Build release APK
        run: ./gradlew assembleReleaseConfigRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m"

      - name: Upload ARMv8 APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-recorder-arm64-v8a-release
          path: app/build/outputs/apk/releaseConfig/release/*.apk
          if-no-files-found: error
